[project]
name = "agent-mlops"
version = "0.1.0"
description = "Track B - MLOps for the W15 assistant + W16 agentic feature: uv, MLflow prompt/config tracking, Evidently LLM regression tests."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # --- W15 assistant (previously requirements.txt) ---
    "fastapi>=0.110",
    "uvicorn[standard]>=0.28",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "openai>=1.14",
    "langchain-text-splitters>=0.0.1",
    "sentence-transformers>=2.5.1",
    "qdrant-client>=1.8",
    "pypdf>=4.1",
    "python-multipart>=0.0.9",
    "requests>=2.31",
    "redis>=5.0",
    "tenacity>=8.2",
    "slowapi>=0.1.9",
    # --- W17 MLOps ---
    # MLflow 2.x + a SQLAlchemy < 2.1 (2.1 breaks MLflow 2.22's tracking store on import).
    "mlflow>=2.16,<3",
    "sqlalchemy>=2.0,<2.1",
    "evidently[llm]>=0.7,<0.8",
    "pandas>=2.2",
    "tabulate>=0.9",
    "matplotlib>=3.8",
    "pyyaml>=6",
]

[dependency-groups]
ui = ["streamlit>=1.32"]
dev = ["pytest>=8"]

[tool.uv]
package = false
link-mode = "copy"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
